# Kafka connection
kafka.bootstrap-servers=127.0.0.1:9092
kafka.bootstrap-servers.failover=127.0.0.1:9192
kafka.partitions-per-topic=5
kafka.replication-factor=2
kafka.consumer.group-id=message-processing-group
kafka.consumer.max-poll-records=500
kafka.consumer.poll-timeout-ms=500
kafka.producer.delivery-timeout-ms=120000

# Message queue limits and storage
mq.size.max-allowed=102400
mq.size.file-offload-threshold=20480
mq.storage.file-dir=./message-payloads/
mq.scheduler.interval-minutes=5
mq.scheduler.initial-delay-minutes=5

# Preserved database tables
db.url=jdbc:mysql://localhost:3306/message_queue
db.username=root
db.password=root

# Embedded Tomcat (used by Main)
http.port=8080
